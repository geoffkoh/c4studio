# Dependabot version updates.
#
# Vulnerability *scanning* is a repository setting, not this file: Dependabot
# alerts and security updates are enabled on the repo and act on their own,
# regardless of what is configured here. This file is the routine side —
# keeping dependencies current so a security bump is a small diff rather than
# a jump across several majors.
#
# Note the project rule in CLAUDE.md: no new dependencies without asking.
# Dependabot only bumps what is already declared, so it never violates that —
# but its pull requests still need a human to merge them.
version: 2

updates:
  # Python. `uv` rather than `pip`: this project's dependency state lives in
  # pyproject.toml *and* uv.lock, and only the uv ecosystem updates the lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR for the routine noise; majors stay separate so they get read.
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The npm workspace at the root covers frontend/ and packages/diagram-core,
  # which have no lockfiles of their own. editors/vscode is a separate install
  # with its own lockfile, so it needs its own directory here.
  #
  # These PRs cannot be merged as they arrive, and that is deliberate rather
  # than unnoticed. The committed bundle must match its source or CI fails,
  # and Dependabot does not run `npm run build` — so any bump that changes
  # bundle output produces a PR no rebase can rescue.
  #
  # PP-159 weighed ignoring those packages here. Keeping them means the
  # standing signal that a dependency is behind stays visible, and the cost
  # is a manual rebuild: take the PR over on your own branch and close
  # Dependabot's. CLAUDE.md, "Dependabot cannot merge a frontend bump on its
  # own", has the steps.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/editors/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # @types/vscode is pinned *to* engines.vscode, not merely kept behind
      # it: `vsce package` refuses outright when the types are newer than the
      # engine floor, and typing against APIs the floor does not have is the
      # bug it is preventing. Bumping it means deciding to require a newer
      # VS Code of every user, which is a release decision — so it is made by
      # editing both fields together, not by merging a types bump.
      - dependency-name: "@types/vscode"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Covers .github/workflows/ and the composite action.yml in the root, which
  # pins actions/checkout and actions/setup-python.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
