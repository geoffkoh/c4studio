[project]
# Renamed from "pystructurizr-studio" in PP-106: the old name was a
# mouthful, and "pystructurizr" itself belongs to an unrelated PyPI
# project. C4 is the notation, not a vendor's product, so the name stays
# honest even if support broadens beyond Structurizr DSL.
name = "c4studio"
version = "0.3.0"
description = "Parse Structurizr DSL/JSON and generate C4 diagrams in Mermaid, with a CLI and a React web app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geoffrey Koh" }]
requires-python = ">=3.13"
keywords = ["structurizr", "c4", "architecture", "diagrams", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/geoffkoh/c4studio"

[project.optional-dependencies]
# The assistant is the one feature that leaves the machine, and the only
# one with a dependency of its own. Optional so a default install is
# unchanged by it — nothing imports `anthropic` unless --assistant is on.
assistant = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Also a dev dependency: without it the assistant's own code path
    # cannot be type-checked or tested, only mocked around.
    "anthropic>=1.0",
]

[project.scripts]
# Short on purpose: this is the thing typed daily.
c4 = "c4studio.cli.main:cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "c4studio"

[tool.ruff.lint]
# The rule set is declared here rather than inherited from ruff's defaults,
# because inheriting it made a version bump a silent change of contract.
#
# ruff 0.15's default selection is `E4, E7, E9, F`. 0.16 replaced that with
# a much broader curated set, and this code — unchanged — went from zero
# findings to 116. Dependabot proposed exactly that bump (#167), bundled
# with five unrelated packages, where it read as a routine patch update.
#
# So this list is 0.15's default, written down: the same rules the gate has
# actually been enforcing, verified by diffing `--show-settings` against the
# bare 0.15 default. Upgrading ruff is now just an upgrade. Adopting 0.16's
# wider set is a separate, reviewable decision — PP-158, which works through
# those 116 findings on their merits.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# 0.16's formatter reaches into Python blocks in Markdown, which is new and
# unwanted here. Prose snippets are written to be read, not to satisfy a
# formatter: it collapsed a deliberately line-per-argument README example
# onto one long line, and padded the compact `# Before` / `# After`
# fragments in COMPATIBILITY_ROADMAP.md with module-level blank lines. Those
# are illustrations, not modules. Formatting stays on real source files.
exclude = ["*.md"]

[tool.mypy]
# Strict by default, so `uv run mypy .` — the command in CLAUDE.md and the
# one run before every PR — is the strict one. Without this it ran with
# default settings and strictness could regress unnoticed.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    # tests/test_action.py parses action.yml and the dogfood workflow.
    # pyyaml is already present transitively (uvicorn[standard]), but the
    # tests should not lean on another package's dependency tree.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Declared so `uv run mypy .` runs inside the project environment. Left
    # undeclared it resolved to an ephemeral install that could not see
    # project-installed type stubs, and the version drifted per machine.
    "mypy>=1.11",
    # Same reasoning, and it went unnoticed longer: `uv run ruff` resolved
    # to an ephemeral install on a developer's machine and to nothing at
    # all in CI, where the first run of the gate failed with
    # "Failed to spawn: ruff". The project's own gate tools have to be
    # project dependencies.
    # The 0.15 pin was here because an unpinned declaration pulled 0.16 and
    # a pile of new findings. That was the right call, but it treated the
    # symptom: the rules were coming from ruff's defaults, so the *version*
    # was the contract. [tool.ruff.lint] now states the rules outright, and
    # the upgrade is just an upgrade — hence the wider bound.
    "ruff>=0.15.22,<0.17",
]
