[project]
# Renamed from "pystructurizr-studio" in PP-106: the old name was a
# mouthful, and "pystructurizr" itself belongs to an unrelated PyPI
# project. C4 is the notation, not a vendor's product, so the name stays
# honest even if support broadens beyond Structurizr DSL.
name = "c4studio"
version = "0.3.0"
description = "Parse Structurizr DSL/JSON and generate C4 diagrams in Mermaid, with a CLI and a React web app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geoffrey Koh" }]
requires-python = ">=3.13"
keywords = ["structurizr", "c4", "architecture", "diagrams", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/geoffkoh/c4studio"

[project.optional-dependencies]
# The assistant is the one feature that leaves the machine, and the only
# one with a dependency of its own. Optional so a default install is
# unchanged by it — nothing imports `anthropic` unless --assistant is on.
assistant = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Also a dev dependency: without it the assistant's own code path
    # cannot be type-checked or tested, only mocked around.
    "anthropic>=1.0",
]

[project.scripts]
# Short on purpose: this is the thing typed daily.
c4 = "c4studio.cli.main:cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "c4studio"

[tool.ruff.lint]
# The rule set is declared here rather than inherited from ruff's defaults,
# because inheriting it made a version bump a silent change of contract.
#
# ruff 0.15's default selection is `E4, E7, E9, F`. 0.16 replaced that with
# a much broader curated set, and this code — unchanged — went from zero
# findings to 116. Dependabot proposed exactly that bump (#167), bundled
# with five unrelated packages, where it read as a routine patch update.
#
# PP-157 set this to `E4, E7, E9, F` — 0.15's default, written down — so
# that upgrading ruff stopped being a change of contract. PP-158 then took
# 0.16's 116 findings one family at a time, on merit rather than by
# inheriting them. What is here was chosen; what is not is listed below
# with the reason, so the next person does not have to re-derive it.
select = [
    # The 0.15 baseline.
    "E4", "E7", "E9", "F",
    # 35 findings. CLAUDE.md already mandates stdlib / third-party / local
    # ordering as a convention; nothing enforced it until now.
    "I",
    # 48. `Optional[X]` → `X | None` and one deprecated import, on a
    # codebase that requires 3.13.
    "UP",
    # 22, every one a FastAPI `Depends()` in a signature — see
    # flake8-bugbear below. The rest of the family was already clean.
    "B",
    # Small and real: one collapsible `if`, five `re.I` → `re.IGNORECASE`,
    # one implicit concatenation in a list, four manual comprehensions, two
    # naming slips, four os.path calls with a pathlib equivalent.
    "SIM", "FURB", "ISC", "PERF", "N", "PTH",
    # One `subprocess.run` with no `check=`, the single finding in all 116
    # that looked like a latent bug rather than style.
    "PLW",
    # Currently zero findings. Adopted as guard rails: they cost nothing
    # today and catch real errors (PLE), dead comprehension work (C4) and
    # unreachable `else` branches after `return` (RET).
    "C4", "PLE", "RET",
    # Two specific rules rather than all of RUF: an unsorted `__all__`, and
    # a list built only to take its first element. RUF001/RUF002 flag the
    # em dashes and ✅ this project uses deliberately in prose.
    "RUF015", "RUF022",
]

# Considered and declined, with the count each would have added:
#
#   PLC0415 import-outside-top-level (28) — local imports here are
#       deliberate. `assistant.py` imports `anthropic` lazily so the
#       optional extra stays optional; that is the architecture, not a slip.
#   TRY003  raise-vanilla-args (37) — this project writes long, specific
#       exception messages on purpose. The rule wants them moved into
#       exception classes, which would make them harder to read, not safer.
#   PLR2004 magic-value-comparison (210) and the PLR complexity metrics
#       (too-many-branches and friends, 42) — overwhelmingly in tests,
#       where a literal in an assertion is the point.
#   D       pydocstyle (~700, mostly D103 on test functions) — CLAUDE.md's
#       docstring rule is about public API in `src/`, not test bodies.
#       Worth revisiting with per-file-ignores for `tests/`; too large to
#       bundle into a lint-adoption change.
#   S       flake8-bandit (1741, almost all S101 `assert` in tests).

ignore = [
    # UP042 wants `class Severity(str, Enum)` rewritten as `StrEnum`, on 17
    # enums. It is presented as a modernisation and is a behaviour change:
    # `str()` and f-string interpolation of a `(str, Enum)` member give
    # `ViewType.SYSTEM_CONTEXT`, and of a `StrEnum` member give the value.
    # `c4 list-views` prints exactly that, so the CLI's output would change
    # under a lint fix. JSON is unaffected — `json.dumps` gives the value
    # either way — which is what makes it easy to wave through.
    #
    # Possibly worth doing deliberately, with the output change intended and
    # the tests updated. Not as a side effect of adopting a rule set.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# B008 flags every `Depends()` in a signature — 22 of them in server.py.
# That is how FastAPI declares a dependency, not a mutable default shared
# between calls, so the rule is wrong here rather than the code.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
# 0.16's formatter reaches into Python blocks in Markdown, which is new and
# unwanted here. Prose snippets are written to be read, not to satisfy a
# formatter: it collapsed a deliberately line-per-argument README example
# onto one long line, and padded the compact `# Before` / `# After`
# fragments in COMPATIBILITY_ROADMAP.md with module-level blank lines. Those
# are illustrations, not modules. Formatting stays on real source files.
exclude = ["*.md"]

[tool.mypy]
# Strict by default, so `uv run mypy .` — the command in CLAUDE.md and the
# one run before every PR — is the strict one. Without this it ran with
# default settings and strictness could regress unnoticed.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    # tests/test_action.py parses action.yml and the dogfood workflow.
    # pyyaml is already present transitively (uvicorn[standard]), but the
    # tests should not lean on another package's dependency tree.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Declared so `uv run mypy .` runs inside the project environment. Left
    # undeclared it resolved to an ephemeral install that could not see
    # project-installed type stubs, and the version drifted per machine.
    "mypy>=1.11",
    # Same reasoning, and it went unnoticed longer: `uv run ruff` resolved
    # to an ephemeral install on a developer's machine and to nothing at
    # all in CI, where the first run of the gate failed with
    # "Failed to spawn: ruff". The project's own gate tools have to be
    # project dependencies.
    # The 0.15 pin was here because an unpinned declaration pulled 0.16 and
    # a pile of new findings. That was the right call, but it treated the
    # symptom: the rules were coming from ruff's defaults, so the *version*
    # was the contract. [tool.ruff.lint] now states the rules outright, and
    # the upgrade is just an upgrade — hence the wider bound.
    "ruff>=0.15.22,<0.17",
]
